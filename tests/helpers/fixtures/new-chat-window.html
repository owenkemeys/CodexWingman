<!doctype html>
<html>
  <head><meta charset="utf-8"><title>New chat controls fixture</title></head>
  <body>
    <button id="header-new-chat" aria-label="New chat"><span aria-hidden="true">+</span></button>
    <button id="sidebar-new-task" title="New task"><span aria-hidden="true">compose</span></button>
    <div id="compact-new-chat" role="button" tabindex="0" aria-label="Start a new chat"></div>
    <button id="disabled-new-chat" aria-label="New chat" disabled></button>
    <button id="unrelated">Open recent chat</button>
    <div id="native-menu" role="menu" data-native-fixture="true"><button role="menuitem">Native item</button></div>
  </body>
</html>
